name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-28.5-elixir-1.19.5-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality suite
        run: mix ci

      - name: Run Snap7 packet interoperability suite
        run: S7_CAPTURE_FILE="${RUNNER_TEMP}/s7-snap7.pcap" bash scripts/run_snap7_packet_check.sh

      - name: Upload S7 packet capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-snap7-pcap
          path: ${{ runner.temp }}/s7-snap7.pcap
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.3"
            otp: "26.2.5.21"
          - elixir: "1.18.4"
            otp: "27.3.4.16"
          - elixir: "1.19.5"
            otp: "28.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Compile and test
        run: |
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test
